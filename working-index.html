<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RealtorPro AI - Working Version</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        .fade-in { animation: fadeIn 0.5s ease-in; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .slide-up { animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Mock AI Requests Data
        const mockRequests = [
            {
                id: 1,
                category: 'Marketing',
                title: 'Create listing description for 3-bedroom condo',
                description: 'Need a compelling listing description for a modern 3-bedroom condo in downtown with city views',
                eta: '~15 min',
                status: 'Queued',
                progress: 0,
                team: 'marketing',
                priority: 7,
                tags: [{ text: 'High Priority', color: 'bg-red-100 text-red-800' }]
            },
            {
                id: 2,
                category: 'Data Analysis',
                title: 'Market analysis for Miami Beach properties',
                description: 'Analyze recent sales trends and pricing in Miami Beach area',
                eta: '~25 min',
                status: 'Processing',
                progress: 65,
                team: 'analytics',
                priority: 5,
                tags: []
            },
            {
                id: 3,
                category: 'Campaign',
                title: 'Social media posts for new listing',
                description: 'Create Instagram and Facebook posts for luxury waterfront property',
                eta: '~5 min',
                status: 'Ready for Review',
                progress: 100,
                team: 'social',
                priority: 8,
                tags: [{ text: 'Has Deliverables', color: 'bg-green-100 text-green-800' }]
            }
        ];

        // Component: Bottom Navigation
        function BottomNav({ currentView, onViewChange }) {
            const navItems = [
                { id: 'dashboard', icon: '🏠', label: 'Dashboard' },
                { id: 'requests', icon: '🤖', label: 'AI Requests' },
                { id: 'tasks', icon: '✓', label: 'Tasks' },
                { id: 'properties', icon: '🏢', label: 'Properties' },
                { id: 'profile', icon: '👤', label: 'Profile' }
            ];

            return (
                <nav className="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 px-6 py-2">
                    <div className="flex justify-around">
                        {navItems.map(item => (
                            <button
                                key={item.id}
                                onClick={() => onViewChange(item.id)}
                                className={`flex flex-col items-center py-2 px-3 rounded-lg transition-colors ${
                                    currentView === item.id ? 'text-blue-600 bg-blue-50' : 'text-gray-600'
                                }`}
                            >
                                <span className="text-xl mb-1">{item.icon}</span>
                                <span className="text-xs">{item.label}</span>
                            </button>
                        ))}
                    </div>
                </nav>
            );
        }

        // Component: Request Card
        function RequestCard({ request }) {
            const statusColors = {
                'Queued': 'bg-blue-100 text-blue-800',
                'Processing': 'bg-yellow-100 text-yellow-800',
                'Ready for Review': 'bg-green-100 text-green-800'
            };

            return (
                <div className="bg-white p-4 rounded-xl border border-gray-200 shadow-sm slide-up">
                    <div className="flex items-center justify-between mb-3">
                        <span className={`text-xs px-2 py-1 rounded-full ${statusColors[request.status]}`}>
                            {request.status}
                        </span>
                        <span className="text-xs text-gray-500">{request.eta}</span>
                    </div>
                    
                    <h3 className="font-semibold text-gray-900 mb-2">{request.title}</h3>
                    <p className="text-sm text-gray-600 mb-3 line-clamp-2">{request.description}</p>
                    
                    <div className="flex items-center justify-between mb-2">
                        <span className="text-xs bg-gray-100 text-gray-700 px-2 py-1 rounded">
                            {request.category}
                        </span>
                        <span className="text-xs text-gray-500">Priority: {request.priority}</span>
                    </div>

                    {request.progress > 0 && (
                        <div className="mb-2">
                            <div className="flex justify-between text-xs text-gray-500 mb-1">
                                <span>Progress</span>
                                <span>{request.progress}%</span>
                            </div>
                            <div className="w-full h-2 bg-gray-200 rounded-full">
                                <div 
                                    className="h-2 bg-blue-500 rounded-full transition-all duration-300" 
                                    style={{width: `${request.progress}%`}}
                                ></div>
                            </div>
                        </div>
                    )}

                    {request.tags.length > 0 && (
                        <div className="flex flex-wrap gap-1">
                            {request.tags.map((tag, idx) => (
                                <span key={idx} className={`text-xs px-2 py-1 rounded-full ${tag.color}`}>
                                    {tag.text}
                                </span>
                            ))}
                        </div>
                    )}
                </div>
            );
        }

        // Component: AI Requests View
        function RequestsView() {
            const [statusFilter, setStatusFilter] = useState('all');
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                setTimeout(() => setLoading(false), 800);
            }, []);

            const filteredRequests = statusFilter === 'all' 
                ? mockRequests 
                : mockRequests.filter(req => req.status === statusFilter);

            const statusOptions = [
                { value: 'all', label: 'All', count: mockRequests.length },
                { value: 'Queued', label: 'Queued', count: mockRequests.filter(r => r.status === 'Queued').length },
                { value: 'Processing', label: 'Processing', count: mockRequests.filter(r => r.status === 'Processing').length },
                { value: 'Ready for Review', label: 'Ready for Review', count: mockRequests.filter(r => r.status === 'Ready for Review').length }
            ];

            if (loading) {
                return (
                    <div className="flex items-center justify-center min-h-screen pb-20">
                        <div className="text-center">
                            <div className="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mx-auto mb-4"></div>
                            <p className="text-gray-600">Loading AI Requests...</p>
                        </div>
                    </div>
                );
            }

            return (
                <div className="pb-20">
                    {/* Header */}
                    <div className="bg-white border-b border-gray-200 p-6 sticky top-0 z-10">
                        <h1 className="text-2xl font-bold text-gray-900 mb-4 fade-in">🤖 AI Requests</h1>
                        
                        {/* Status Filters */}
                        <div className="flex gap-2 overflow-x-auto pb-2">
                            {statusOptions.map(option => (
                                <button
                                    key={option.value}
                                    onClick={() => setStatusFilter(option.value)}
                                    className={`px-3 py-2 text-xs font-medium rounded-full whitespace-nowrap transition-all ${
                                        statusFilter === option.value
                                            ? 'bg-blue-600 text-white shadow-md'
                                            : 'bg-gray-100 text-gray-600 hover:bg-gray-200'
                                    }`}
                                >
                                    {option.label} ({option.count})
                                </button>
                            ))}
                        </div>
                    </div>

                    {/* Content */}
                    <div className="p-6">
                        <div className="space-y-4">
                            {filteredRequests.map((request, index) => (
                                <div key={request.id} style={{ animationDelay: `${index * 0.1}s` }}>
                                    <RequestCard request={request} />
                                </div>
                            ))}
                        </div>

                        {filteredRequests.length === 0 && (
                            <div className="text-center py-12">
                                <div className="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-4">
                                    <span className="text-2xl">🤖</span>
                                </div>
                                <h3 className="text-lg font-medium text-gray-900 mb-2">No requests found</h3>
                                <p className="text-gray-500">No requests match the selected filter.</p>
                            </div>
                        )}
                    </div>

                    {/* Success indicator */}
                    <div className="fixed top-4 right-4 bg-green-100 border border-green-400 text-green-700 px-3 py-2 rounded-lg shadow-lg fade-in">
                        ✅ Frontend Working!
                    </div>
                </div>
            );
        }

        // Component: Dashboard View
        function DashboardView() {
            return (
                <div className="p-6 pb-20">
                    <h1 className="text-2xl font-bold text-gray-900 mb-6 fade-in">🏠 Dashboard</h1>
                    
                    <div className="grid gap-6">
                        <div className="bg-white p-6 rounded-xl shadow-sm slide-up">
                            <h2 className="text-lg font-semibold mb-4">Quick Stats</h2>
                            <div className="grid grid-cols-3 gap-4">
                                <div className="text-center">
                                    <div className="text-2xl font-bold text-blue-600">3</div>
                                    <div className="text-xs text-gray-600">Active Requests</div>
                                </div>
                                <div className="text-center">
                                    <div className="text-2xl font-bold text-green-600">1</div>
                                    <div className="text-xs text-gray-600">Completed</div>
                                </div>
                                <div className="text-center">
                                    <div className="text-2xl font-bold text-yellow-600">1</div>
                                    <div className="text-xs text-gray-600">In Progress</div>
                                </div>
                            </div>
                        </div>
                        
                        <div className="bg-white p-6 rounded-xl shadow-sm slide-up">
                            <h2 className="text-lg font-semibold mb-4">RealtorPro AI</h2>
                            <p className="text-gray-600 mb-4">Your AI-powered real estate assistant is ready to help with marketing, analytics, social media, and more.</p>
                            <div className="bg-blue-50 p-4 rounded-lg">
                                <p className="text-sm text-blue-800">✨ Frontend is now working with mock data!</p>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // Component: Simple placeholder for other views
        function PlaceholderView({ title, icon }) {
            return (
                <div className="p-6 pb-20 text-center">
                    <div className="fade-in">
                        <span className="text-6xl mb-4 block">{icon}</span>
                        <h1 className="text-2xl font-bold text-gray-900 mb-4">{title}</h1>
                        <p className="text-gray-600">This view is coming soon.</p>
                    </div>
                </div>
            );
        }

        // Main App Component
        function App() {
            const [currentView, setCurrentView] = useState('requests');
            
            const renderView = () => {
                switch(currentView) {
                    case 'dashboard':
                        return <DashboardView />;
                    case 'requests':
                        return <RequestsView />;
                    case 'tasks':
                        return <PlaceholderView title="Tasks" icon="✓" />;
                    case 'properties':
                        return <PlaceholderView title="Properties" icon="🏢" />;
                    case 'profile':
                        return <PlaceholderView title="Profile" icon="👤" />;
                    default:
                        return <DashboardView />;
                }
            };

            return (
                <div className="min-h-screen bg-gray-50">
                    {renderView()}
                    <BottomNav currentView={currentView} onViewChange={setCurrentView} />
                </div>
            );
        }

        // Initialize the app
        console.log('🚀 RealtorPro AI Frontend Loading...');
        ReactDOM.render(<App />, document.getElementById('root'));
        console.log('✅ RealtorPro AI Frontend Loaded Successfully!');
    </script>
</body>
</html>
