name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'  # Phase-1 pin

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov

      - name: Lint & type (optional if configured)
        run: |
          echo "skip ruff/mypy if not configured yet"

      - name: Run backend tests
        env:
          PYTHONPATH: backend
        run: |
          pytest backend/tests --maxfail=1 -q --disable-warnings --cov=backend.app --cov-report=xml

      - name: Upload backend coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.xml

  frontend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: aura-client/package-lock.json

      - name: Install
        working-directory: aura-client
        run: npm ci

      - name: Lint
        working-directory: aura-client
        run: npm run lint --if-present

      - name: Typecheck
        working-directory: aura-client
        run: npm run typecheck --if-present

      - name: Build
        working-directory: aura-client
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: aura-client-dist
          path: aura-client/dist
