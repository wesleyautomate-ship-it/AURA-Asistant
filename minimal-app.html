<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RealtorPro AI - Minimal React App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root" class="bg-gray-100 min-h-screen"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Mock data (same as what we put in the service)
        const mockRequests = [
            {
                id: 1,
                category: 'Marketing',
                title: 'Create listing description for 3-bedroom condo',
                description: 'Need a compelling listing description for a modern 3-bedroom condo in downtown with city views',
                eta: '~15 min',
                status: 'Queued',
                progress: 0,
                assignees: [{ id: 'ai' }],
                tags: [{ text: 'High Priority', color: 'bg-red-100 text-red-800' }]
            },
            {
                id: 2,
                category: 'Data Analysis',
                title: 'Market analysis for Miami Beach properties',
                description: 'Analyze recent sales trends and pricing in Miami Beach area',
                eta: '~25 min',
                status: 'Processing',
                progress: 65,
                assignees: [{ id: 'ai' }],
                tags: []
            },
            {
                id: 3,
                category: 'Campaign',
                title: 'Social media posts for new listing',
                description: 'Create Instagram and Facebook posts for luxury waterfront property',
                eta: '~5 min',
                status: 'Ready for Review',
                progress: 100,
                assignees: [{ id: 'ai' }],
                tags: [{ text: 'Has Deliverables', color: 'bg-green-100 text-green-800' }]
            }
        ];

        function RequestCard({ request }) {
            const statusColors = {
                'Queued': 'bg-blue-100 text-blue-800',
                'Processing': 'bg-yellow-100 text-yellow-800',
                'Ready for Review': 'bg-green-100 text-green-800'
            };

            return (
                <div className="bg-white p-4 rounded-xl border border-gray-200 shadow-sm">
                    <div className="flex items-center justify-between mb-2">
                        <span className={`text-xs px-2 py-1 rounded-full ${statusColors[request.status]}`}>
                            {request.status}
                        </span>
                        <span className="text-xs text-gray-500">{request.eta}</span>
                    </div>
                    <h3 className="font-semibold text-gray-900 mb-2">{request.title}</h3>
                    <p className="text-sm text-gray-600 mb-3">{request.description}</p>
                    <div className="flex items-center justify-between">
                        <span className="text-xs bg-gray-100 text-gray-700 px-2 py-1 rounded">
                            {request.category}
                        </span>
                        {request.progress > 0 && (
                            <div className="flex items-center space-x-2">
                                <div className="w-16 h-1 bg-gray-200 rounded-full">
                                    <div 
                                        className="h-1 bg-blue-500 rounded-full" 
                                        style={{width: `${request.progress}%`}}
                                    ></div>
                                </div>
                                <span className="text-xs text-gray-500">{request.progress}%</span>
                            </div>
                        )}
                    </div>
                    {request.tags.length > 0 && (
                        <div className="flex flex-wrap gap-1 mt-2">
                            {request.tags.map((tag, idx) => (
                                <span key={idx} className={`text-xs px-2 py-1 rounded-full ${tag.color}`}>
                                    {tag.text}
                                </span>
                            ))}
                        </div>
                    )}
                </div>
            );
        }

        function RequestsView() {
            const [statusFilter, setStatusFilter] = useState('all');
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                // Simulate loading
                setTimeout(() => setLoading(false), 1000);
            }, []);

            const filteredRequests = statusFilter === 'all' 
                ? mockRequests 
                : mockRequests.filter(req => req.status === statusFilter);

            const statusOptions = [
                { value: 'all', label: 'All', count: mockRequests.length },
                { value: 'Queued', label: 'Queued', count: mockRequests.filter(r => r.status === 'Queued').length },
                { value: 'Processing', label: 'Processing', count: mockRequests.filter(r => r.status === 'Processing').length },
                { value: 'Ready for Review', label: 'Ready for Review', count: mockRequests.filter(r => r.status === 'Ready for Review').length }
            ];

            if (loading) {
                return (
                    <div className="min-h-screen bg-gray-50 flex items-center justify-center">
                        <div className="text-center">
                            <div className="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mx-auto mb-4"></div>
                            <p className="text-gray-600">Loading AI Requests...</p>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-gray-50">
                    <div className="bg-white border-b border-gray-200 p-6">
                        <h1 className="text-2xl font-bold text-gray-900 mb-4">AI Requests</h1>
                        
                        {/* Status Filters */}
                        <div className="flex gap-2 overflow-x-auto">
                            {statusOptions.map(option => (
                                <button
                                    key={option.value}
                                    onClick={() => setStatusFilter(option.value)}
                                    className={`px-3 py-2 text-xs font-medium rounded-full whitespace-nowrap transition-colors ${
                                        statusFilter === option.value
                                            ? 'bg-blue-100 text-blue-800'
                                            : 'bg-gray-100 text-gray-600 hover:bg-gray-200'
                                    }`}
                                >
                                    {option.label} ({option.count})
                                </button>
                            ))}
                        </div>
                    </div>

                    <div className="p-6">
                        {filteredRequests.length === 0 ? (
                            <div className="text-center py-12">
                                <div className="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-4">
                                    <svg className="w-8 h-8 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                                    </svg>
                                </div>
                                <h3 className="text-lg font-medium text-gray-900 mb-2">No requests found</h3>
                                <p className="text-gray-500">No requests match the selected filter.</p>
                            </div>
                        ) : (
                            <div className="space-y-4">
                                {filteredRequests.map(request => (
                                    <RequestCard key={request.id} request={request} />
                                ))}
                            </div>
                        )}
                    </div>

                    {/* Success Message */}
                    <div className="fixed bottom-4 right-4 bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded shadow-lg">
                        ✅ React app is working! This proves the frontend can render.
                    </div>
                </div>
            );
        }

        function App() {
            return <RequestsView />;
        }

        // Render the app
        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
